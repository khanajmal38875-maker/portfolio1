<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> range input</title>
</head>
<body>
 <form action="/server">
    <label for="volume">volume</label>
<input type="range" min="0" max="100" name="volume" id="volume" step="7" value="77">
<button type="submit">submit</button>

 </form>   
</body>
</html>
